name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -B -m unittest discover -s tests -v

  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - run: node --test tests/model.test.mjs

  # The real helper CLI against stub hyprctl/herdr/notify-send, a real
  # process tree and a real herdr socket; plus collect -> SwitchrModel
  # (Node) -> jump. Node is required here, not optional.
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - run: python3 -B -m unittest discover -s tests/integration -v
        env:
          SWITCHR_REQUIRE_NODE: "1"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install ruff==0.16.10
      - run: ruff check helper tests
      - name: JSON files parse
        run: |
          for f in manifest.json tests/fixtures/*.json; do \
            python3 -m json.tool "$f" > /dev/null || exit 1; \
          done
      - name: Manifest id matches the overlay fallback
        run: |
          id=$(python3 -c 'import json; print(json.load(open("manifest.json"))["id"])')
          grep -q "\"$id\"" Switchr.qml
